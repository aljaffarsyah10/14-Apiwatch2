version: "3.8"

services:
  # ----------------------------------------------------
  # PostgreSQL Database (Internal only, not exposed)
  # ----------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: apiwatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apiwatch}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - apiwatch_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-apiwatch}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------
  # Redis Cache & BullMQ Queue (Internal only, not exposed)
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: apiwatch-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis_secure_password}"]
    volumes:
      - redis_data:/data
    networks:
      - apiwatch_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------
  # Database Migration Runner (One-off startup job)
  # ----------------------------------------------------
  migration:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: apiwatch-migration
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password}@postgres:5432/${POSTGRES_DB:-apiwatch}?schema=public"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - apiwatch_internal

  # ----------------------------------------------------
  # Next.js Web Application
  # ----------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apiwatch-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password}@postgres:5432/${POSTGRES_DB:-apiwatch}?schema=public"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redis_secure_password}@redis:6379"
      AUTH_SECRET: ${AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      APP_URL: ${APP_URL:-http://localhost}
      EMAIL_FROM: ${EMAIL_FROM:-alerts@apiwatch.dev}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - apiwatch_internal

  # ----------------------------------------------------
  # Dedicated BullMQ Background Monitoring Worker
  # ----------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: apiwatch-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password}@postgres:5432/${POSTGRES_DB:-apiwatch}?schema=public"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redis_secure_password}@redis:6379"
      AUTH_SECRET: ${AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      APP_URL: ${APP_URL:-http://localhost}
      EMAIL_FROM: ${EMAIL_FROM:-alerts@apiwatch.dev}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - apiwatch_internal

  # ----------------------------------------------------
  # Caddy Reverse Proxy & Automatic HTTPS
  # ----------------------------------------------------
  proxy:
    image: caddy:2-alpine
    container_name: apiwatch-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - apiwatch_internal

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  apiwatch_internal:
    driver: bridge
