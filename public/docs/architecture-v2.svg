<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#141419"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#121215"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #f4f4f5; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #a1a1aa; }
    .node-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #71717a; }
    .badge { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; font-weight: 600; }
  </style>

  <!-- Canvas -->
  <rect width="1000" height="520" rx="14" fill="url(#archBg)" stroke="#27272a" stroke-width="1.5"/>

  <!-- Title header -->
  <text x="40" y="44" class="title" font-size="20">APIWatch v2.0 Modular Monolith Architecture</text>
  <text x="40" y="68" class="subtitle">Decoupled Next.js Web Application, BullMQ Worker, and Hardened Internal Network</text>

  <!-- Public Internet / Client Layer -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="920" height="60" rx="8" fill="url(#cardGrad)" stroke="#27272a"/>
    <text x="24" y="35" class="title" font-size="14">🌐 Public Internet &amp; Clients</text>
    <text x="300" y="35" class="subtitle">Web Browsers • On-Call Teams • External Webhooks • Prometheus Scrapers</text>
    <rect x="800" y="18" width="100" height="24" rx="12" fill="rgba(59, 130, 246, 0.15)"/>
    <text x="815" y="34" class="badge" fill="#60a5fa">TLS 1.3 / HTTPS</text>
  </g>

  <!-- Inbound Traffic Arrow -->
  <path d="M 500 160 L 500 190" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="500,195 496,186 504,186" fill="#3b82f6"/>

  <!-- Reverse Proxy Layer (Caddy 2) -->
  <g transform="translate(40, 196)">
    <rect x="0" y="0" width="920" height="64" rx="8" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="16" y="16" width="32" height="32" rx="6" fill="url(#blueGlow)"/>
    <text x="24" y="38" class="title" font-size="16" fill="#ffffff">⚡</text>
    <text x="60" y="32" class="title" font-size="14">Caddy 2 Reverse Proxy (Automated TLS)</text>
    <text x="60" y="48" class="node-text">Automatic Let's Encrypt Certificates • HSTS (max-age 63072000) • Gzip/Zstd • Rate Limit Mitigation</text>
    <rect x="790" y="20" width="110" height="24" rx="4" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="802" y="36" class="badge" fill="#10b981">Ports 80 / 443</text>
  </g>

  <!-- Downward Split Arrows to Internal Docker Network -->
  <path d="M 270 260 L 270 300" stroke="#3b82f6" stroke-width="2"/>
  <polygon points="270,305 266,296 274,296" fill="#3b82f6"/>

  <path d="M 730 260 L 730 300" stroke="#8b5cf6" stroke-width="2"/>
  <polygon points="730,305 726,296 734,296" fill="#8b5cf6"/>

  <!-- Docker Bridge Network Box -->
  <rect x="40" y="296" width="920" height="196" rx="10" fill="none" stroke="#27272a" stroke-dasharray="6,6"/>
  <text x="60" y="316" class="badge" fill="#71717a">INTERNAL DOCKER BRIDGE NETWORK (apiwatch_internal - Strictly No Public Ingress)</text>

  <!-- Next.js Web Container (Left) -->
  <g transform="translate(60, 330)">
    <rect x="0" y="0" width="410" height="144" rx="8" fill="url(#cardGrad)" stroke="#27272a"/>
    <rect x="16" y="16" width="110" height="20" rx="4" fill="rgba(59, 130, 246, 0.2)"/>
    <text x="24" y="30" class="badge" fill="#60a5fa">NEXT.JS 16 WEB</text>
    <text x="16" y="58" class="title" font-size="14">Next.js 16 App Router &amp; APIs</text>
    <text x="16" y="78" class="node-text">• React 19 UI with Partial Prerendering</text>
    <text x="16" y="96" class="node-text">• REST APIs, Auth Cookies &amp; Billing Webhooks</text>
    <text x="16" y="114" class="node-text">• Prometheus Metrics &amp; Deep Health Probes</text>
    <text x="16" y="132" class="node-text">• In-Memory LRU + Dual-Layer Cache</text>
  </g>

  <!-- Dedicated Worker Container (Right) -->
  <g transform="translate(530, 330)">
    <rect x="0" y="0" width="410" height="144" rx="8" fill="url(#cardGrad)" stroke="#27272a"/>
    <rect x="16" y="16" width="130" height="20" rx="4" fill="rgba(139, 92, 246, 0.2)"/>
    <text x="24" y="30" class="badge" fill="#c084fc">BULLMQ WORKER</text>
    <text x="16" y="58" class="title" font-size="14">Dedicated Monitoring Worker</text>
    <text x="16" y="78" class="node-text">• High-Throughput HTTP/HTTPS Probe Executor</text>
    <text x="16" y="96" class="node-text">• Multi-Layer SSRF Sandbox &amp; DNS Guard</text>
    <text x="16" y="114" class="node-text">• Deep Assertion Validation &amp; Latency Tracker</text>
    <text x="16" y="132" class="node-text">• Automated Incident Engine &amp; Email Dispatcher</text>
  </g>

  <!-- Internal Cross Arrows to Shared Storage -->
  <g transform="translate(480, 370)">
    <!-- PostgreSQL & Redis Connection Pill -->
    <rect x="-40" y="0" width="100" height="60" rx="6" fill="#18181b" stroke="#27272a"/>
    <text x="-30" y="24" class="node-text" font-weight="600" fill="#a1a1aa">Postgres 16</text>
    <text x="-30" y="46" class="node-text" font-weight="600" fill="#a1a1aa">Redis 7</text>
  </g>
</svg>
